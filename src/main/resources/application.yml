server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: cloud-picture-backend
#  配置数据库
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306
    username: root
    password: 123456
mybatis-plus:
  configuration:
    #mybatis配置
    map-underscore-to-camel-case: false
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete #全局逻辑删除的具体字段名字
      logic-not-delete-value: 1 #被逻辑删除的值
      logic-delete-value: 0 #未被逻辑删除时的值
#配置接口文档
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.li.cloudpicturebackend.controller